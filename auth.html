<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Octane Launcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #15171c;
            color: #e6e6e6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .content {
            text-align: center;
            max-width: 420px;
        }

        .check {
            width: 144px;
            height: 144px;
            margin-bottom: 8px;
        }

        .check path {
            fill: none;
            stroke: #4572e3;
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: draw 0.35s ease-out forwards;
        }

        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin-bottom: 10px;
        }

        .close-message {
            font-size: 13px;
            color: #7d8590;
        }
    </style>
</head>
<body>
    <div class="content">
        <svg class="check" viewBox="0 0 72 72" aria-hidden="true">
            <path d="M22 37 L32 47 L50 27"/>
        </svg>
        <h1>You're now signed in to Octane Launcher.</h1>
        <p class="close-message">You can now close this window and return to the launcher</p>
    </div>
</body>
</html>
