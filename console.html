<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Console</title>
    <link rel="preload" href="/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-700.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Poppins";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("/fonts/poppins-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "Poppins";
        font-style: normal;
        font-weight: 500;
        font-display: block;
        src: url("/fonts/poppins-500.woff2") format("woff2");
      }
      @font-face {
        font-family: "Poppins";
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url("/fonts/poppins-600.woff2") format("woff2");
      }
      @font-face {
        font-family: "Poppins";
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url("/fonts/poppins-700.woff2") format("woff2");
      }

      :root {
        --bg-primary: #15171c;
      }

      :root.theme-light {
        --bg-primary: #f2f2f5;
      }

      :root.theme-rose {
        --bg-primary: #1f1a24;
      }

      :root.theme-cherry {
        --bg-primary: #2c1618;
      }

      body {
        background-color: var(--bg-primary);
        margin: 0;
        padding: 0;
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        height: 100vh;
        overflow: hidden;
      }

      #root {
        height: 100vh;
      }
    </style>
    <script>
      try {
        const theme = localStorage.getItem('octane_theme') || 'octane'
        if (theme !== 'octane') {
          document.documentElement.classList.add('theme-' + theme)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/frontend/console.ts"></script>
  </body>
</html>
