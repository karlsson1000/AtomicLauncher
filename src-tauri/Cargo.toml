[package]
name = "OctaneLauncher"
version = "0.1.0-dev"
description = "A Minecraft Launcher"
authors = ["karlsson1000"]
edition = "2021"

[lib]
name = "octane_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
webbrowser = "1.0"
dirs = "5.0"
oauth2 = "4.4"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
uuid = { version = "1.0", features = ["serde", "v4"] }
tiny_http = "0.12"
sha1 = "0.10"
tauri-plugin-shell = "2"
zip = "2.2"
sysinfo = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
dotenvy = "0.15"
open = "5.0"
lazy_static = "1.4"
libc = "0.2"
sha2 = "0.10"
keyring = { version = "3", features = ["windows-native", "sync-secret-service"] }
discord-rich-presence = "1.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
